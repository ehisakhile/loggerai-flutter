name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish:
    # A tag like v0.1.0 publishes to pub.dev. Turn on "Automated publishing" for this
    # repository on the package's pub.dev Admin page first (no secret needed).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev
