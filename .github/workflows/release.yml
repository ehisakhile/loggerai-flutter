name: Test and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish:
    # A tag like v0.1.1 publishes to pub.dev. Turn on "Automated publishing" for this
    # repository on the package's pub.dev Admin page first (no secret needed).
    # Dart's reusable publish workflow has no Flutter, which this package needs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write   # pub.dev trusts GitHub's sign-in for this repository
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1   # sets up the pub.dev sign-in from GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --force
